name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python for U2NetP model conversion
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate and validate U2NetP TFLite asset
        run: |
          python -m pip install --disable-pip-version-check \
            tensorflow==2.17.1 onnx==1.17.0 onnxruntime==1.20.1 pillow==11.1.0
          mkdir -p /tmp/photon-models app/src/main/assets/u2netp
          curl --fail --location --retry 3 \
            https://huggingface.co/edgetools/u2netp/resolve/25dee37/u2netp.onnx \
            --output /tmp/photon-models/u2netp.onnx
          echo "309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  /tmp/photon-models/u2netp.onnx" | sha256sum --check
          python scripts/convert_u2netp_to_tflite.py \
            --source /tmp/photon-models/u2netp.onnx \
            --output app/src/main/assets/u2netp/u2netp.tflite
          test -s app/src/main/assets/u2netp/u2netp.tflite
          test -s app/src/main/assets/u2netp/u2netp.json

      - name: Verify front-camera crop regression guard
        run: |
          test_file="app/src/test/java/com/hinnka/mycamera/lut/RealtimeVideoRendererTransformTest.kt"
          renderer_file="app/src/main/java/com/hinnka/mycamera/lut/RealtimeVideoRenderer.kt"
          controller_file="app/src/main/java/com/hinnka/mycamera/camera/Camera2Controller.kt"
          preview_renderer_file="app/src/main/java/com/hinnka/mycamera/lut/LutRenderer.kt"
          stabilization_test_file="app/src/test/java/com/hinnka/mycamera/stabilization/RealtimeStabilizationMathTest.kt"
          grep -Fq 'fun frontEightMpFourThreeToPortrait4kKeepsCropInOutputQuadAxes()' "$test_file"
          grep -Fq 'fun unrotatedEightMpSourceUsesItsUnrotatedCropGeometry()' "$test_file"
          grep -Fq 'fun landscapeRearCameraCropRemainsUnchanged()' "$test_file"
          grep -Fq 'return resolveOutputQuadCropRect(' "$renderer_file"
          grep -Fq 'val shouldFlipEncodedFrame = isCurrentCameraFrontFacing()' "$controller_file"
          grep -Fq 'if (oesFrameUpdated) useCurrentOesFrame()' "$preview_renderer_file"
          grep -Fq 'val oesFrameUpdated = frameAvailable.getAndSet(false) && acquireLatestCameraFrame()' "$preview_renderer_file"
          grep -Fq 'cameraManager.openCamera(openCameraId, cameraStateCallback, cameraHandler)' "$controller_file"
          ! grep -Fq 'StandbyCameraController' "$controller_file"
          ! grep -Fq 'standbyCameraInputSurface' "app/src/main/java/com/hinnka/mycamera/ui/camera/CameraGLSurfaceView.kt"
          grep -Fq 'fun enhancedStabilizationSupportsFrontAndRearCamerasOnly()' "$stabilization_test_file"

      - name: Run video transform regression tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDefaultDebugUnitTest \
            --tests com.hinnka.mycamera.lut.RealtimeVideoRendererTransformTest \
            --tests com.hinnka.mycamera.stabilization.RealtimeStabilizationMathTest \
            --tests com.hinnka.mycamera.video.VideoLogProfileTest \
            --stacktrace

      - name: Build default debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDefaultDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-camera-debug-apk
          path: app/build/outputs/apk/default/debug/app-default-debug.apk
          if-no-files-found: error
