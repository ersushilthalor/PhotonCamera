name: Apply compatible upstream fixes (Nov 12)

on:
  push:
    branches:
      - integration/upstream-safe-2026-11-12
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safe integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/upstream-safe-2026-11-12
          fetch-depth: 0

      - name: Fetch upstream commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/bjzhou/PhotonCamera.git
          git fetch --no-tags upstream

      - name: Apply self-contained fixes only
        shell: bash
        run: |
          set -euo pipefail
          commits=(
            0da9a414463dd2b1081cf251ee8c7b3daaf0d7eb
            d23e4431d514d3b69d8b0cc1c0ee0b72be994f27
            5552cb82fb528aead764472468f7335da0c040b9
          )

          for sha in "${commits[@]}"; do
            if git log --format=%B | grep -Fq "$sha"; then
              echo "Already present: $sha"
              continue
            fi

            if git cherry-pick -x -X ours "$sha"; then
              git push origin HEAD:refs/heads/integration/upstream-safe-2026-11-12
              continue
            fi

            # Any remaining textual conflicts are resolved in favor of the customized fork.
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            if [[ -z "$conflicts" ]]; then
              git cherry-pick --skip
            else
              while IFS= read -r path; do
                stages="$(git ls-files -u -- "$path" | awk '{print $3}' | sort -u)"
                if printf '%s\n' "$stages" | grep -qx "2"; then
                  git checkout --ours -- "$path"
                  git add -- "$path"
                elif printf '%s\n' "$stages" | grep -qx "3"; then
                  git rm --ignore-unmatch -- "$path"
                else
                  echo "::error::Cannot safely resolve $path"
                  exit 1
                fi
              done <<< "$conflicts"

              if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
                echo "::error::Unresolved cherry-pick conflict"
                exit 1
              fi
              if git diff --cached --quiet; then
                git cherry-pick --skip
              else
                GIT_EDITOR=true git cherry-pick --continue
              fi
            fi

            git push origin HEAD:refs/heads/integration/upstream-safe-2026-11-12
          done
