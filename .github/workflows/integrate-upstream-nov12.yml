name: Integrate selected upstream commits (Nov 12–13)

on:
  push:
    branches:
      - integration/upstream-2026-11-12
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: photon-camera-nov12-integration
  cancel-in-progress: false

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPOSITORY: https://github.com/bjzhou/PhotonCamera.git
      TARGET_BRANCH: integration/upstream-2026-11-12
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/upstream-2026-11-12
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream

      - name: Cherry-pick upstream commits in chronological order
        id: integrate
        shell: bash
        run: |
          set -uo pipefail
          commits=(
            0da9a414463dd2b1081cf251ee8c7b3daaf0d7eb
            d23e4431d514d3b69d8b0cc1c0ee0b72be994f27
            e657e62e873094203e3eef438142d0f2d48653ca
            27122c19e486b5af5f6fb743df1895c767286bb8
            d51628e94fbb7f675e808c3b3040787360c2d318
            c0df537e97b7677dc7e1fe91aa0acacb4dcb5a2b
            04a21bf5f71b109b75d98a1a5d4b847f1b61ebd3
            bfffdf112cc83906985a465fbbe835651887cdaa
            5552cb82fb528aead764472468f7335da0c040b9
            51a38020dd3422aefebb41ed91afce7f55990ff7
            f3449a1a82b9f3ce0d757c5ea49002e33d123fca
          )

          applied=0
          skipped=0
          ours_resolutions=0
          for sha in "${commits[@]}"; do
            if git log --format=%B | grep -Fq "$sha"; then
              echo "Already integrated: $sha"
              ((skipped+=1))
              continue
            fi

            echo "::group::Cherry-pick $sha"
            if git cherry-pick -x -X ours "$sha"; then
              ((applied+=1))
              git push origin "HEAD:refs/heads/$TARGET_BRANCH"
              echo "Applied $sha"
            else
              conflicts=$(git diff --name-only --diff-filter=U || true)
              if [[ -z "$conflicts" ]]; then
                # An empty cherry-pick can occur when the fork already contains its net effect.
                git cherry-pick --skip || exit 1
                ((skipped+=1))
                echo "Skipped empty/already represented commit $sha"
              else
                while IFS= read -r path; do
                  stages=$(git ls-files -u -- "$path" | awk '{print $3}' | sort -u)
                  if printf '%s\n' "$stages" | grep -qx "2"; then
                    # Preserve the customized fork's version for any remaining conflict.
                    git checkout --ours -- "$path"
                    git add -- "$path"
                    ((ours_resolutions+=1))
                  elif printf '%s\n' "$stages" | grep -qx "3"; then
                    # The fork had deleted this path; preserve that intentional deletion.
                    git rm --ignore-unmatch -- "$path"
                    ((ours_resolutions+=1))
                  else
                    echo "::error::Cannot safely resolve unmerged path: $path"
                    exit 1
                  fi
                done <<< "$conflicts"

                if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
                  echo "::error::Unresolved merge entries remain for $sha"
                  exit 1
                fi

                if git diff --cached --quiet; then
                  git cherry-pick --skip || exit 1
                  ((skipped+=1))
                else
                  GIT_EDITOR=true git cherry-pick --continue || exit 1
                  ((applied+=1))
                fi
                git push origin "HEAD:refs/heads/$TARGET_BRANCH"
              fi
            fi
            echo "::endgroup::"
          done

          {
            echo "### Integration summary"
            echo "- Applied during this run: $applied"
            echo "- Already present or empty: $skipped"
            echo "- Remaining conflict paths resolved by preserving fork versions/deletions: $ours_resolutions"
            echo "- Target: `$TARGET_BRANCH` (not main)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "applied=$applied" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"

      - name: Open integration pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          title="Integrate PhotonCamera upstream changes (Nov 12–13, 2026)"
          body=$(cat <<'EOF'
          This PR cherry-picks the original PhotonCamera commits from Nov 12–13, 2026 in chronological order.

          Upstream: `bjzhou/PhotonCamera`
          Target: customized fork `main`

          For unresolved textual conflicts, the integration workflow preserves the fork's existing version of the affected path instead of overwriting custom code. Review the full diff carefully: this conservative choice can mean an upstream change in a conflicted file is not included. Run the Android build and test the camera on-device before merging.
          EOF
          )
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$TARGET_BRANCH" --title "$title" --body "$body"
          fi
